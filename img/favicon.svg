<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sindyanna of Galilee">
  <!-- Brand favicon: gold olive + leaf on dark rounded background -->
  <defs>
    <linearGradient id="olive-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D48B"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#9A7D2E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#1D1D1B"/>

  <!-- Leaf -->
  <path d="M34 22c8-9 18-9 18-9s0 10-9 13c-4.6 1.6-8.3.4-9.9-1.4z"
        fill="#6B7B5E"/>
  <path d="M34 22c5-4.5 12-7 18-9" fill="none" stroke="#333D29"
        stroke-width="1.4" stroke-linecap="round"/>

  <!-- Olive -->
  <ellipse cx="28" cy="38" rx="13" ry="16" transform="rotate(-18 28 38)"
           fill="url(#olive-gold)"/>
  <!-- Highlight -->
  <ellipse cx="23" cy="32" rx="3.4" ry="5"
           transform="rotate(-18 23 32)" fill="#E8D48B" opacity="0.6"/>
  <!-- Stem -->
  <path d="M30 23c1.6 1.2 2.6 3 3 5" fill="none" stroke="#333D29"
        stroke-width="2" stroke-linecap="round"/>
</svg>
